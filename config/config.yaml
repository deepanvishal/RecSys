project:
  name: serko-recsys
  seed: 42
  version: '1.0.0'


wandb:
  project: serko-recsys
  entity: null
  enabled: true
  log_system_metrics: true
  tags: ['electronics', 'recsys', 'serko']


data:
  raw_dir: data/raw/
  processed_dir: data/processed/
  cache_dir: artifacts/cache/
  dataset_name: McAuley-Lab/Amazon-Reviews-2023
  category: Electronics
  min_user_interactions: 1
  min_item_interactions: 5
  max_sequence_length: 50
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  rating_threshold: 1


simulation:
  sparse_cohorts:
    cold: 0
    sparse_low: 1
    sparse_high: 5
    warm: 6
  min_users_per_cohort: 500
  daily_new_users: 50
  daily_deprecation_rate: 0.01
  daily_new_item_rate: 0.01
  simulation_days: 7


models:
  cf:
    type: both
    neighborhood_sizes: [10, 20, 50]
    similarity_metric: cosine
    cache_similarity: true
    save_path: artifacts/models/cf/


  svd:
    factors: [64, 128, 256]
    default_factors: 128
    regularization: 0.01
    iterations: 20
    num_threads: 8
    save_path: artifacts/models/svd/


  two_tower:
    user_embedding_dim: 128
    item_embedding_dim: 128
    mlp_hidden_dims: [256, 128]
    dropout: 0.2
    batch_size: 2048
    learning_rate: 0.001
    weight_decay: 1e-5
    warmup_steps: 1000
    max_epochs: 20
    early_stopping_patience: 3
    temperature: 0.07
    sentence_transformer_model: all-MiniLM-L6-v2
    save_path: artifacts/models/two_tower/
    embeddings_path: artifacts/embeddings/
    device: cuda


faiss:
  index_type: FlatIP
  index_path: artifacts/indexes/
  nprobe: 10
  top_k_retrieval: 100


inference:
  tier_thresholds:
    cold_max: 0
    sparse_max: 5
  default_n_recommendations: 10
  trending_window_days: 30
  confidence_labels:
    cold: none
    sparse: low
    warm: high
  tier_labels:
    cold: cold
    sparse: sparse
    warm: warm
  model_labels:
    cold: trending
    sparse: svd
    warm: two_tower


evaluation:
  k_values: [5, 10, 20]
  primary_k: 10
  n_test_users: 1000
  popularity_buckets:
    head: 0.2
    torso: 0.5
    tail: 1.0


api:
  host: 0.0.0.0
  port: 8000
  reload: true
  log_level: info


ui:
  port: 8501
  max_users_displayed: 100
  animation_delay_ms: 500


paths:
  artifacts: artifacts/
  logs: logs/
  report: report/
