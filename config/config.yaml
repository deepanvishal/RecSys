project:
  name: serko-recsys
  seed: 42
  version: '1.0.0'
  device: cuda  # global device — all modules reference this


wandb:
  project: serko-recsys-movielens
  entity: null
  enabled: true
  log_system_metrics: true
  tags: ['movielens', 'ml-1m', 'recsys', 'serko']


data:
  raw_dir: data/raw/
  processed_dir: data/processed/
  cache_dir: artifacts/cache/
  dataset_name: movielens-1m
  download_url: https://files.grouplens.org/datasets/movielens/ml-1m.zip
  min_user_interactions: 20   # ML-1M already enforces this
  min_item_interactions: 1
  max_sequence_length: 200    # ML-1M users have long histories
  rating_threshold: 1         # treat all ratings as implicit positive
  delimiter: '::'             # ML-1M uses :: not comma


simulation:
  sparse_cohorts:
    cold: 0
    sparse_low: 1
    sparse_high: 5
    warm: 6
  min_users_per_cohort: 500
  daily_new_users: 50
  daily_deprecation_rate: 0.01
  daily_new_item_rate: 0.01
  simulation_days: 7


models:
  cf:
    K_values: [10, 20, 50]
    save_path: artifacts/models/cf/


  svd:
    factors: [32, 64, 128]
    regularization: [0.01, 0.1]
    iterations: 50
    save_path: artifacts/models/svd/


  two_tower:
    sentence_transformer_model: all-MiniLM-L6-v2
    embeddings_path: artifacts/embeddings/
    temperature: 0.2
    batch_size: 512
    lr: 0.001
    epochs: 30
    patience: 3           # 3 consecutive eval checkpoints (every 5 epochs) without improvement
    max_seq_len: 200
    save_path: artifacts/models/two_tower/


  sasrec:
    hidden: 128
    max_len: 200
    num_blocks: 2
    num_heads: 2
    dropout: 0.2
    batch_size: 256
    lr: 0.001
    weight_decay: 0.0
    epochs: 50
    patience: 5
    save_path: artifacts/models/sasrec/


  bert4rec:
    hidden: 128
    max_len: 200
    num_blocks: 2
    num_heads: 2
    dropout: 0.2
    mask_prob: 0.2
    batch_size: 256
    lr: 0.001
    weight_decay: 0.0
    epochs: 50
    patience: 5
    save_path: artifacts/models/bert4rec/


faiss:
  index_type: FlatIP
  index_path: artifacts/indexes/
  nprobe: 10
  top_k_retrieval: 100


inference:
  tier_thresholds:
    cold_max: 0
    sparse_max: 5
  default_n_recommendations: 10
  trending_window_days: 30
  confidence_labels:
    cold: none
    sparse: low
    warm: high
  tier_labels:
    cold: cold
    sparse: sparse
    warm: warm
  model_labels:
    cold: trending
    sparse: svd
    warm: two_tower


evaluation:
  k_values: [5, 10, 20]
  primary_k: 10
  n_test_users: 1000
  popularity_buckets:
    head: 0.2
    torso: 0.5
    tail: 1.0


api:
  host: 0.0.0.0
  port: 8000
  reload: true
  log_level: info


ui:
  port: 8501
  max_users_displayed: 100
  animation_delay_ms: 500


paths:
  artifacts: artifacts/
  logs: logs/
  report: report/
